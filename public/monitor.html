<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
    <title>NodeControl | Monitor</title>
  </head>
  <body data-page="monitor">
    <main class="container">
      <header class="topbar">
        <div>
          <h1>NodeControl</h1>
          <p class="muted">Monitor</p>
        </div>
        <nav class="nav">
          <a class="active" href="/monitor.html">Monitor</a>
          <a href="/system.html">System</a>
          <a href="/notes.html">Notes</a>
          <a href="/files.html">Files</a>
          <a href="/clipboard.html">Clipboard</a>
          <button id="logout-button" type="button" class="secondary">Logout</button>
        </nav>
      </header>

      <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
          <p id="monitor-status" class="message" style="margin:0;" aria-live="polite">Connecting...</p>
          <button type="button" id="monitor-refresh" class="secondary" style="min-height:36px;padding:0.35rem 0.75rem;">Refresh</button>
        </div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">CPU</div>
            <div class="stat-value" id="cpu-value">--%</div>
            <div class="stat-bar-track"><div class="stat-bar" id="cpu-bar"></div></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">RAM</div>
            <div class="stat-value" id="ram-value">-- / --</div>
            <div class="stat-bar-track"><div class="stat-bar" id="ram-bar"></div></div>
          </div>
          <div class="stat-card" id="battery-card" style="display:none;">
            <div class="stat-label">Battery</div>
            <div class="stat-value" id="battery-value">--%</div>
            <div class="stat-bar-track"><div class="stat-bar" id="battery-bar"></div></div>
            <div class="muted" id="battery-status" style="font-size:0.8rem;margin-top:0.4rem;"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2 class="section-title">Disk</h2>
        <div id="disk-list" class="list"></div>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
