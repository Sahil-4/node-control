<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
    <title>NodeControl | System</title>
  </head>
  <body data-page="system">
    <main class="container">
      <header class="topbar">
        <div>
          <h1>NodeControl</h1>
          <p class="muted">System Utilities</p>
        </div>
        <nav class="nav">
          <a href="/monitor.html">Monitor</a>
          <a class="active" href="/system.html">System</a>
          <a href="/notes.html">Notes</a>
          <a href="/files.html">Files</a>
          <a href="/clipboard.html">Clipboard</a>
          <button id="logout-button" type="button" class="secondary">Logout</button>
        </nav>
      </header>

      <!-- Run command -->
      <section class="panel">
        <form id="system-form" class="stack">
          <label>
            Action
            <select id="system-action" required>
              <optgroup label="System">
                <option value="HTOP">HTOP</option>
                <option value="LS">LS</option>
                <option value="PROCESSES">PROCESSES</option>
                <option value="SCREENSHOT">SCREENSHOT</option>
                <option value="REBOOT">REBOOT</option>
              </optgroup>
              <optgroup label="Files">
                <option value="READ_FILE">Read File</option>
              </optgroup>
              <optgroup label="Tunnel">
                <option value="TUNNEL_START">Start Tunnel</option>
                <option value="TUNNEL_STOP">Stop Tunnel</option>
                <option value="TUNNEL_STATUS">Tunnel Status</option>
              </optgroup>
              <optgroup id="shortcuts-optgroup" label="Shortcuts"></optgroup>
              <optgroup label="Admin">
                <option value="SESSIONS">Sessions</option>
              </optgroup>
            </select>
          </label>
          <label id="input-label">
            Input
            <input id="system-input" type="text" placeholder="" />
          </label>
          <p id="system-scope-hint" class="muted hidden" style="font-size:0.8rem;margin:0;"></p>
          <div class="actions">
            <button type="submit">Run</button>
            <button type="button" id="save-shortcut" class="secondary">Save as Shortcut</button>
            <button type="button" id="delete-shortcut" class="danger hidden">Delete Shortcut</button>
          </div>
        </form>
        <p id="system-message" class="message" aria-live="polite"></p>

        <!-- Tunnel active indicator -->
        <div id="tunnel-active" class="hidden" style="margin-top:0.75rem;padding:0.65rem;border:1px solid var(--panel-border);border-radius:6px;">
          <div class="meta" style="margin-bottom:0.5rem;">Tunnel Active</div>
          <input id="tunnel-active-url" type="text" readonly style="margin-bottom:0.5rem;" />
          <div class="actions" style="margin-top:0;">
            <button type="button" id="tunnel-copy">Copy URL</button>
            <button type="button" id="tunnel-qr" class="secondary">QR Code</button>
          </div>
          <div id="tunnel-qr-container" class="qr-container" style="margin-top:0.75rem;"></div>
        </div>
      </section>

      <section class="panel">
        <pre id="system-output" class="output">Run an action to see output here.</pre>
      </section>

    </main>

    <!-- QR modal -->
    <div id="qr-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="QR Code">
      <div class="modal-box">
        <div class="modal-header">
          <span>QR Code</span>
          <button type="button" id="qr-modal-close" class="secondary">Close</button>
        </div>
        <div id="qr-container" class="qr-container"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
