# Path: /etc/nginx/sites-available/admin.blackbox.loc
server {
    listen 80;
    server_name admin.blackbox.loc;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.blackbox.loc;

    ssl_certificate     /home/alpha/.local/share/mkcert/admin.blackbox.loc.pem;
    ssl_certificate_key /home/alpha/.local/share/mkcert/admin.blackbox.loc-key.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:8056;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:8056/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }
}
